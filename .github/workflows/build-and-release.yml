name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.25

    - name: Install desktop build dependencies
      run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libgtk-3-dev

    - name: Test
      run: go test -v ./...

  build:
    name: Build
    needs: test
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: darwin
            arch: amd64
          - runner: macos-15
            target: darwin
            arch: arm64
          - runner: windows-latest
            target: windows
            arch: amd64
          - runner: ubuntu-latest
            target: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: linux
            arch: arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.25

    - name: Install Linux desktop build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libgtk-3-dev

    - name: Install Fyne packaging tool
      run: go install fyne.io/tools/cmd/fyne@v1.7.2

    - name: Build and package
      shell: bash
      run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_NAME="photo-renamer_${GITHUB_REF_NAME}_${{ matrix.target }}-${{ matrix.arch }}"
          mkdir -p build

          if [ "${{ matrix.target }}" = "darwin" ]; then
            go build -tags migrated_fynedo -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o photo-renamer .
            fyne package --source-dir . --os darwin --executable photo-renamer --name PhotoRenamer --icon icon.png --app-version "$VERSION" --app-build "${GITHUB_RUN_NUMBER}" --release
            ditto -c -k --sequesterRsrc --keepParent PhotoRenamer.app "build/${ASSET_NAME}.zip"
          elif [ "${{ matrix.target }}" = "windows" ]; then
            go build -tags migrated_fynedo -ldflags "-s -w -H windowsgui -X main.Version=${GITHUB_REF_NAME}" -o photo-renamer-bin.exe .
            fyne package --source-dir . --os windows --executable photo-renamer-bin.exe --name PhotoRenamer --icon icon.png --app-version "$VERSION" --app-build "${GITHUB_RUN_NUMBER}" --release
            7z a "build/${ASSET_NAME}.zip" PhotoRenamer.exe
          else
            go build -tags migrated_fynedo -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o photo-renamer .
            fyne package --source-dir . --os linux --executable photo-renamer --name PhotoRenamer --icon icon.png --app-version "$VERSION" --app-build "${GITHUB_RUN_NUMBER}" --release
            archive=$(find . -maxdepth 1 -type f -name 'PhotoRenamer*.tar*' -print -quit)
            test -n "$archive"
            extension="${archive#./PhotoRenamer.}"
            mv "$archive" "build/${ASSET_NAME}.${extension}"
          fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: photo-renamer_${{ github.ref_name }}_${{ matrix.target }}-${{ matrix.arch }}
        path: build/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract Release Notes
        run: |
          VERSION="${{ github.ref_name }}"
          START_LINE=$(grep -n "^## .*$VERSION" CHANGELOG.md | head -n 1 | cut -d: -f1)
          
          if [ -z "$START_LINE" ]; then
            echo "Error: Version $VERSION not found in CHANGELOG.md"
            exit 1
          fi
          
          NEXT_HEADER_LINE=$(tail -n +$((START_LINE + 1)) CHANGELOG.md | grep -n "^## " | head -n 1 | cut -d: -f1)
          
          if [ -z "$NEXT_HEADER_LINE" ]; then
            tail -n +$((START_LINE + 1)) CHANGELOG.md > release_notes.md
          else
            END_LINE=$((START_LINE + NEXT_HEADER_LINE))
            sed -n "$((START_LINE + 1)),$((END_LINE - 1))p" CHANGELOG.md > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: release_notes.md
          generate_release_notes: false
